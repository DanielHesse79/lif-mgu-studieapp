<!doctype html>
<html lang="sv" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>LIF MGU – Studieapp för läkemedelsinformatörer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Skydd: avregistrera ev. kvarvarande service worker (t.ex. PWA:n från ett
      // annat projekt på samma localhost-port) och töm cacharna, så att fel app
      // inte serveras cache-first. LIF-appen använder ingen service worker.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          if (!regs.length) return
          Promise.all(regs.map((r) => r.unregister()))
            .then(() =>
              'caches' in window
                ? caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
                : null
            )
            .then(() => location.reload())
        }).catch(() => {})
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
