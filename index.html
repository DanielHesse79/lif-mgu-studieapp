<!doctype html>
<html lang="sv" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <meta name="description" content="Studieapp för LIF-auktorisation (läkemedelsinformatör) på MGU-nivå" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- iPhone: installerbar som app via Dela → Lägg till på hemskärmen -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LIF MGU" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>LIF MGU – Studieapp för läkemedelsinformatörer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Skydd, ENDAST i dev-läge: avregistrera ev. kvarvarande service worker
      // (t.ex. PWA:n från ett annat projekt på samma localhost-port) och töm
      // cacharna, så att fel app inte serveras cache-first. I produktion har
      // appen en egen service worker (vite-plugin-pwa) som inte får röras.
      if ('%DEV%' === 'true' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          if (!regs.length) return
          Promise.all(regs.map((r) => r.unregister()))
            .then(() =>
              'caches' in window
                ? caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
                : null
            )
            .then(() => location.reload())
        }).catch(() => {})
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
